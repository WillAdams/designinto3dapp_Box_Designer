[project]
name = "box-designer"
version = "1.0.0"
description = "Design a dimensioned box and export its six-face layout as a DXF file."
requires-python = ">=3.12"
authors = [
    { name = "William Adams", email = "willadams@aol.com" }
]
dependencies = [
    "flet"
]

[dependency-groups]
dev = [
    "flet-cli",
    "flet-desktop",
    "flet-web"
]

[tool.flet.metadata]
title = "Box Designer"

[tool.flet]
org = "dev.flet"
company = "William Adams"
copyright = "Copyright (C) 2026 by William Adams"

[tool.flet.app]
path = "src"
